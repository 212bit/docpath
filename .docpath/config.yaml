default_level: 1
workflow:
  auto_brainstorm: true
  auto_subagent: true
  enforce_tdd: false
  enforce_review: false
  agent_flow: true
project:
  name: "docpath"
  description: "文径 DocPath — 渐进式文档驱动工作流 (Document as Finite State Machine)"
  type: "node"
  language: "TypeScript"
  framework: ""
  created_at: "2026-05-30"
paths:
  state: .docpath/workspace/current.md
  breadcrumb: .docpath/workspace/breadcrumb.md
  tasks: .docpath/tasks/
  spec: .docpath/spec/
  journal: .docpath/journal/
trace: true
# 文档扫描路径（FR-4/FR-5）：白名单语义 —— 只扫声明的路径，
# 不递归未声明目录。新增项目文档请在此登记，否则 docpath docs doctor/lint
# 会漏扫（表现为"假绿"：报告 HEALTHY 但文件从未进入扫描面）。
# noise 由 §4.d 排除（.gitignore + 硬黑名单：node_modules/.git/dist/build/
# target/.worktrees/coverage 等）。
document_scan_paths:
  - ".docpath/"
  - "README.md"
  - "docs/"
  # Agent 协议文件（对 Agent 可见的持久约定，纳入索引）
  - "AGENTS.md"
  - "CLAUDE.md"
  - "CODEX.md"
  - "OPENCODE.md"
